name: yeetrip
description: "Offline-first group trip budget and expense-splitting app for Indian users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^18.1.1

  # Local SQLite database
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Annotations for code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Charts
  fl_chart: ^1.3.0

  # Localization & Formatting
  intl: ^0.20.2

  # Sharing & CSV Export
  share_plus: ^13.3.1
  csv: ^8.0.0

  # Unique identifier generation
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  freezed: ^4.0.3
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
