name: yeetrip
description: "Offline-first group trip budget and expense-splitting app for Indian users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^18.1.1

  # Local SQLite database
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Persistence
  shared_preferences: ^2.3.5

  # Theming & Modern UI
  google_fonts: ^6.2.1
  dynamic_color: ^1.7.0

  # Charts
  fl_chart: ^1.3.0

  # Localization & Formatting
  intl: ^0.20.2

  # Sharing & CSV Export
  share_plus: ^13.3.1
  csv: ^8.0.0

  # Unique identifier generation
  uuid: ^4.5.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0
  flutter_contacts: ^2.6.0
  google_mlkit_text_recognition: ^1.0.3
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
